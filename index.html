<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Usta Servis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: atölye panosu — solda modül rafı (telefonda alt sekme), sağda iş alanı; plakalar gerçek TR plakası gibi */
:root{
  --bg:#eaeef1; --surface:#ffffff; --surface2:#f4f7f9; --ink:#14202a; --muted:#5a6873; --line:#d3dbe1;
  --brand:#0d4f63; --brand-ink:#ffffff; --brand-soft:#d9eaef;
  --amber:#c98a0b; --amber-soft:#fbf0d6; --ok:#2c7a4b; --ok-soft:#dcf0e3; --bad:#b3362d; --bad-soft:#f8dfdc;
  --plate:#1c3f9c; --plate-bg:#ffffff; --plate-ink:#111;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#162027; --surface2:#1b2730; --ink:#e4ebef; --muted:#92a2ad; --line:#26343d;
  --brand:#4eaec4; --brand-ink:#061217; --brand-soft:#173540;
  --amber:#efb53f; --amber-soft:#3a2d10; --ok:#5ec48b; --ok-soft:#14321f; --bad:#f07b70; --bad-soft:#3d1a17;
  --plate:#2f56c4; --plate-bg:#f1f3f5; --plate-ink:#111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#162027; --surface2:#1b2730; --ink:#e4ebef; --muted:#92a2ad; --line:#26343d;
  --brand:#4eaec4; --brand-ink:#061217; --brand-soft:#173540;
  --amber:#efb53f; --amber-soft:#3a2d10; --ok:#5ec48b; --ok-soft:#14321f; --bad:#f07b70; --bad-soft:#3d1a17;
  --plate:#2f56c4; --plate-bg:#f1f3f5; --plate-ink:#111; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.logo{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:0 8px 2px;line-height:1}
.logo span{color:var(--brand)}
.firm{font-size:12px;color:var(--muted);padding:0 8px 14px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--ink)}
.nav .cnt.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.side .sep{height:1px;background:var(--line);margin:10px 4px}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
main{padding-block:22px 60px;padding-inline:clamp(16px,3vw,32px);min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
h2{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.sub{color:var(--muted);margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr.click:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--amber)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--f-mono);font-size:12.5px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.low td{background:var(--amber-soft)}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid #222;border-radius:4px;background:var(--plate-bg);color:var(--plate-ink);font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;line-height:1}
.plate .tr{background:var(--plate);color:#fff;font-size:8px;padding:0 3px;display:flex;align-items:flex-end;padding-bottom:2px;margin-right:6px;letter-spacing:0}
.plate{padding-right:6px}
.plate>.tr+*{}
.plate{padding-block:0}
.plate::after{content:"";}
.plate{height:22px;align-items:center}
.plate .tr{align-self:stretch}
.plate.big{font-size:22px;height:40px}
.plate.big .tr{font-size:11px;padding:0 6px 4px;margin-right:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.st-acik{background:var(--brand-soft);color:var(--brand)}
.st-parca{background:var(--amber-soft);color:var(--amber)}
.st-hazir{background:var(--ok-soft);color:var(--ok)}
.st-teslim{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st-bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:140px}
.li b{font-weight:600}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0;width:260px;max-width:100%}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.totals{margin-left:auto;width:min(100%,320px);display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-variant-numeric:tabular-nums;padding-top:12px}
.totals .gt{font-family:var(--f-display);font-size:24px;font-weight:700}
.steps{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.steps button{flex:1 1 120px;border:0;border-right:1px solid var(--line);background:none;padding:10px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.steps button:last-child{border-right:0}
.steps button.done{color:var(--ink);background:var(--surface2)}
.steps button.cur{background:var(--brand);color:var(--brand-ink)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amber-soft);color:var(--ink);border-radius:var(--r);padding:9px 14px;margin-bottom:16px;font-size:13px}
.demo b{color:var(--amber)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,14,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,16px) 16px;overflow-y:auto;z-index:50}
.md{background:var(--surface);border-radius:12px;width:min(560px,100%);padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.md h3{font-family:var(--f-display);font-size:24px;text-transform:uppercase;margin:0 0 14px;letter-spacing:.02em}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 2;min-width:0}
.f.half{grid-column:span 1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface2);width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f.chk{flex-direction:row;align-items:center;gap:8px}
.f.chk input{width:auto}
.f .hint{font-size:12px;color:var(--muted)}
.md .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.md .act{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);font-weight:500;z-index:60;max-width:calc(100% - 32px)}
/* portal (müşteri uygulaması) */
.phone{width:min(400px,100%);margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.phone .top{background:var(--surface2);padding:22px 20px 18px;text-align:center}
.phone .row{display:flex;align-items:center;gap:14px;padding:16px 18px;margin:8px 12px;border-radius:12px;background:var(--surface2);cursor:pointer;border:0;width:calc(100% - 24px);text-align:left}
.phone .row svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:none}
.phone .row b{font-family:var(--f-display);font-size:21px;font-weight:600;display:block;line-height:1.1}
.phone .pad{padding:16px 20px}
.phone .fld{margin-bottom:16px}
.phone .fld .k{font-size:13px;font-weight:600;color:var(--muted)}
.phone .fld .v{font-size:19px}
.phone .svc{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.phone .svc .c{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;word-break:break-all;max-width:45%}
.car{width:180px;height:auto;margin:0 auto 6px;display:block}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;gap:2px}
  .side .logo,.side .firm,.side .sep,.side .foot{display:none}
  .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;width:auto;min-width:64px;align-items:center}
  .nav .cnt{display:none}
  main{padding-block:16px 100px}
  h1{font-size:27px}
  .fg{grid-template-columns:1fr}.f.half{grid-column:span 2}
}
@media (prefers-reduced-motion:no-preference){.ov .md{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>

<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>

<script>
(function(){
"use strict";
/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TL=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2}).format(+n||0);
const num=n=>new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2}).format(+n||0);
const z=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const fdate=s=>{if(!s)return"";const p=s.split("-");return p[2]+"."+p[1]+"."+p[0]};
const longDate=s=>s?new Date(s+"T12:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}):"";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const normPlate=p=>String(p||"").toLocaleUpperCase("tr-TR").replace(/[^0-9A-ZÇĞİÖŞÜ]/g,"");
function plateFmt(p){p=normPlate(p);const m=p.match(/^(\d{2})([A-ZÇĞİÖŞÜ]{1,3})(\d{1,5})$/);return m?m[1]+" "+m[2]+" "+m[3]:p}
const plateHTML=(p,big)=>`<span class="plate${big?" big":""}"><span class="tr">TR</span>${esc(plateFmt(p))}</span>`;
const digits=s=>String(s||"").replace(/\D/g,"");
function waNumber(p){let d=digits(p);if(d.startsWith("90"))return d;if(d.startsWith("0"))d=d.slice(1);return d.length===10?"90"+d:d}

/* ---------- veri katmanı ---------- */
const COLS=["customers","vehicles","orders","stock","movements","appts","cash","settings"];
const S={};COLS.forEach(c=>S[c]=[]);
let db=null, MODE="local", readOnly=false, loaded=false;
const LS="usta-servis-v1";
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j)COLS.forEach(c=>S[c]=j[c]||[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function writeErr(e){
  if(e&&(e.code==="invalid_argument"||e.code==="not_granted")){readOnly=true;toast("Bu sayfada değişiklik yapma yetkiniz yok. Sahibinden düzenleme izni isteyin.");render();}
  else if(e&&e.code==="quota_exceeded")toast("Kayıt sınırı doldu. Eski kayıtları silip tekrar deneyin.");
  else toast("Kaydedilemedi. Bağlantıyı kontrol edip tekrar deneyin.");
  throw e;
}
async function put(col,obj){
  const rec=JSON.parse(JSON.stringify(obj));const id=rec.id||uid();delete rec.id;rec.updatedAt=Date.now();
  if(db){try{await db.collection(col).doc(id).set(rec)}catch(e){writeErr(e)}}
  else{const a=S[col];const i=a.findIndex(x=>x.id===id);const r={id,...rec};if(i>=0)a[i]=r;else a.push(r);saveLocal();schedule();}
  return id;
}
async function del(col,id){
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){writeErr(e)}}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();schedule();}
}
const byId=(col,id)=>S[col].find(x=>x.id===id);
const settings=()=>S.settings.find(x=>x.id==="main")||{name:"Oto Servis",phone:"",address:""};

/* ---------- iş kuralları ---------- */
const STATUSES=["Açık","Parça Bekliyor","Hazır","Teslim Edildi"];
const stCls={"Açık":"st-acik","Parça Bekliyor":"st-parca","Hazır":"st-hazir","Teslim Edildi":"st-teslim"};
const pill=s=>`<span class="pill ${stCls[s]||"st-acik"}">${esc(s)}</span>`;
function totals(o){let net=0,kdv=0;(o.lines||[]).forEach(l=>{const t=(+l.qty||0)*(+l.price||0);net+=t;kdv+=t*(+l.kdv||0)/100});return{net,kdv,total:net+kdv}}
const stockQty=s=>(+s.in||0)-(+s.out||0);
const isLow=s=>stockQty(s)<=(+s.min||0);
function balance(cid){let b=0;S.movements.forEach(m=>{if(m.customerId===cid)b+=m.type==="borc"?+m.amount:-m.amount});return Math.round(b*100)/100}
const vehiclesOf=cid=>S.vehicles.filter(v=>v.customerId===cid);
const ordersOfVehicle=vid=>S.orders.filter(o=>o.vehicleId===vid).sort((a,b)=>(b.openedAt||"").localeCompare(a.openedAt||""));
function lastService(vid){return S.orders.filter(o=>o.vehicleId===vid&&o.status==="Teslim Edildi").sort((a,b)=>(b.closedAt||"").localeCompare(a.closedAt||""))[0]}
function nextNo(){let m=0;S.orders.forEach(o=>{const n=parseInt(digits(o.no),10);if(n>m)m=n});return "İE"+String(m+1).padStart(6,"0")}
function nextInvoice(){const y=new Date().getFullYear();let m=0;S.orders.forEach(o=>{if(o.invoiceNo&&String(o.invoiceNo).startsWith(String(y))){const n=+String(o.invoiceNo).slice(4);if(n>m)m=n}});return y+String(m+1).padStart(5,"0")}
function serviceDue(v){
  const ls=lastService(v.id);if(!ls)return null;
  const dueDate=addDays(ls.closedAt,365), dueKm=(+ls.km||0)+15000;
  return{ls,dueDate,dueKm,days:daysBetween(today(),dueDate),kmLeft:dueKm-(+v.km||0)};
}

/* ---------- arayüz durumu ---------- */
let view="panel", param=null, filter="aktif", q="", portal={plate:"",last4:"",vid:null,oid:null,err:""};
try{const h=location.hash.slice(1);if(h)view=h}catch(e){}
function go(v,p){view=v;param=p??null;q="";render();window.scrollTo(0,0)}

const ICONS={
 panel:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/>',
 orders:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
 customers:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.6 5.2"/>',
 stock:'<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>',
 appts:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 kasa:'<rect x="2.5" y="6" width="19" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.8"/><path d="M6 9.5v6M18 9.5v6"/>',
 remind:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>',
 portal:'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/>',

const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

function reminders(){
  const t=today(),tm=addDays(t,1);
  const appts=S.appts.filter(a=>a.date===tm&&a.status==="Bekliyor");
  const ready=S.orders.filter(o=>o.status==="Hazır");
  const due=S.vehicles.map(v=>({v,d:serviceDue(v)})).filter(x=>x.d&&(x.d.days<=30||x.d.kmLeft<=1000)).sort((a,b)=>a.d.days-b.d.days);
  const debt=S.customers.map(c=>({c,b:balance(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  return{appts,ready,due,debt,count:appts.length+ready.length+due.length+debt.length};
}

function renderSide(){

function demoBar(){

function render(){

   .sort((a,b)=>(b.openedAt||"").localeCompare(a.openedAt||"")||(b.no||"").localeCompare(a.no||""));
  const sum=rows.reduce((s,o)=>s+totals(o).total,0);

function fieldHTML(f,v){

  if(f.type==="checkbox")return `<div class="${cls}"><input type="checkbox" id="${id}"${v?" checked":""}><label for="${id}">${f.label}</label></div>`;
  let inp;
  if(f.type==="select")inp=`<select id="${id}">${(f.options||[]).map(o=>{const ov=typeof o==="object"?o.v:o,ol=typeof o==="object"?o.l:o;return `<option value="${esc(ov)}"${String(ov)===String(v??"")?" selected":""}>${esc(ol)}</option>`}).join("")}</select>`;
  else if(f.type==="textarea")inp=`<textarea id="${id}">${esc(v)}</textarea>`;
  else inp=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}"${f.type==="number"?' step="any" inputmode="decimal"':""}${f.list?` list="${f.list}"`:""}${f.ph?` placeholder="${esc(f.ph)}"`:""} autocomplete="off">`;
  return `<div class="${cls}"><label for="${id}">${f.label}${f.req?" *":""}</label>${inp}${f.hint?`<span class="hint">${f.hint}</span>`:""}</div>`;

async function upsertCustomer(name,phone){
  let c=S.customers.find(x=>digits(x.phone)&&digits(x.phone)===digits(phone))||S.customers.find(x=>x.name.toLocaleLowerCase("tr-TR")===name.toLocaleLowerCase("tr-TR"));

const PACKAGE=["yağ filtresi","hava filtresi","polen filtresi","motor yağı","karter tapa pulu"];
async function addPackage(oid){
  const o=byId("orders",oid);const lines=[...(o.lines||[])];const miss=[];
  const brand=(o.brand||"").toLocaleLowerCase("tr-TR");
  PACKAGE.forEach(p=>{const cands=S.stock.filter(s=>s.name.toLocaleLowerCase("tr-TR").includes(p)&&stockQty(s)>0);
    const s=cands.find(s=>(s.brand||"").toLocaleLowerCase("tr-TR")===brand||(s.fits||"").toLocaleLowerCase("tr-TR").includes(brand))||cands[0];
    if(!s){miss.push(p);return}
    lines.push({type:"parca",stockId:s.id,code:s.code,name:s.name,qty:p==="motor yağı"?4:1,unit:s.unit||"Adet",price:+s.sell||0,kdv:s.kdv??20})});
  lines.push({type:"iscilik",name:"Periyodik bakım işçiliği",qty:1,unit:"Saat",price:+(settings().laborRate||1500),kdv:20});
  await put("orders",{...o,lines});toast(miss.length?"Paket eklendi. Stokta yok: "+miss.join(", "):"Periyodik bakım paketi eklendi. Miktarları kontrol edin.");
}

  if(o.status==="Hazır")return `Merhaba ${c.name}, ${plateFmt(o.plate)} plakalı ${o.brand} ${o.model} aracınızın işlemleri tamamlandı, teslim almaya hazır.\nToplam tutar: ${TL(t.total)} (KDV dahil).`+sign();

document.addEventListener("click",e=>{
  if(e.target.dataset&&e.target.dataset.ov){closeModal();return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  if(b.tagName==="A"&&b.getAttribute("href")==="#")e.preventDefault();
  const f=ACT[b.dataset.act];if(f)f(b.dataset.id,b,e);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal").innerHTML)closeModal();
  if(e.key==="Enter"&&e.target.matches("tr.click"))e.target.click();
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;render();return}
  if(MD&&MD.onInput&&e.target.id&&e.target.id.startsWith("f_"))MD.onInput(e.target.id.slice(2),collect());
});
document.addEventListener("change",e=>{if(MD&&MD.onInput&&e.target.tagName==="SELECT"&&e.target.id.startsWith("f_"))MD.onInput(e.target.id.slice(2),collect())});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="portalForm"){
    portal.plate=$("#p_plate").value;portal.last4=$("#p_last4").value;
    const v=findVehicle(portal.plate);const c=v&&byId("customers",v.customerId);
    if(!v||!c||digits(portal.last4).length!==4||!digits(c.phone).endsWith(digits(portal.last4))){portal.err="Plaka ya da telefon numarası eşleşmedi. Bilgileri kontrol edin.";render();return}
    portal.vid=v.id;portal.err="";portal.showHist=true;render();return;
  }
  if(e.target.id==="mform"&&MD){
    const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;
    try{const r=await MD.onSave(collect());if(typeof r==="string"){$("#merr").textContent=r;btn.disabled=false;return}closeModal()}
    catch(err){btn.disabled=false;$("#merr").textContent="Kaydedilemedi.";}
  }
});
